# One-command local stack: `docker compose up` (Compose v2) or `docker-compose up` (v1.29+).
#
# Configuration: each variable below is passed through from .env (or the shell) when set, and
# left empty otherwise. The binaries treat an empty variable as unset and use their built-in
# defaults, which .env.example lists and which match the service names below, so a .env file is
# optional. Interpolation is used instead of `env_file` because Compose v1 has no optional
# env_file, and it reads .env for interpolation whether or not the file exists.

x-app: &app
  image: notification-engine:local
  build: .
  restart: unless-stopped
  environment:
    # Shared
    DATABASE_URL: ${DATABASE_URL:-}
    REDIS_ADDR: ${REDIS_ADDR:-}
    LOG_LEVEL: ${LOG_LEVEL:-}
    SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    # API
    HTTP_ADDR: ${HTTP_ADDR:-}
    MAX_ATTEMPTS: ${MAX_ATTEMPTS:-}
    # Worker
    OPS_ADDR: ${OPS_ADDR:-}
    AMQP_URL: ${AMQP_URL:-}
    PROVIDER_URL: ${PROVIDER_URL:-}
    PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-}
    RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-}
    RATE_LIMIT_SEND_OFFSET: ${RATE_LIMIT_SEND_OFFSET:-}
    RATE_LIMIT_HEADROOM: ${RATE_LIMIT_HEADROOM:-}
    LIMITER_MAX_WAIT: ${LIMITER_MAX_WAIT:-}
    BACKOFF_BASE: ${BACKOFF_BASE:-}
    BACKOFF_MAX: ${BACKOFF_MAX:-}
    BREAKER_CONSECUTIVE_FAILURES: ${BREAKER_CONSECUTIVE_FAILURES:-}
    BREAKER_COOLDOWN: ${BREAKER_COOLDOWN:-}
    BREAKER_MAX_DEFER_AGE: ${BREAKER_MAX_DEFER_AGE:-}
    RELAY_INTERVAL: ${RELAY_INTERVAL:-}
    RELAY_BATCH_SIZE: ${RELAY_BATCH_SIZE:-}
    RELAY_MAX_INFLIGHT_PER_CHANNEL: ${RELAY_MAX_INFLIGHT_PER_CHANNEL:-}
    CONSUMER_CONCURRENCY_PER_CHANNEL: ${CONSUMER_CONCURRENCY_PER_CHANNEL:-}
    REAPER_INTERVAL: ${REAPER_INTERVAL:-}
    REAPER_SENDING_TIMEOUT: ${REAPER_SENDING_TIMEOUT:-}
    REAPER_QUEUED_TIMEOUT: ${REAPER_QUEUED_TIMEOUT:-}
    # Mock provider (contracts/provider.md)
    MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-}
    MOCK_LATENCY: ${MOCK_LATENCY:-}
    MOCK_RETRY_AFTER: ${MOCK_RETRY_AFTER:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify
      POSTGRES_DB: notify
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify -d notify"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672" # management UI (guest/guest)
    healthcheck:
      # check_port_connectivity verifies the AMQP listener accepts connections; ping passes
      # earlier, while the listener is still starting, and the worker would crash-loop.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mockprovider:
    <<: *app
    command: ["/app/mockprovider"]
    ports:
      - "8090:8090" # PUT /control, GET /received (contracts/provider.md)

  migrate:
    <<: *app
    command: ["/app/api", "migrate", "up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["/app/api", "serve"]
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["/app/worker"]
    ports:
      # /healthz, /readyz, /metrics on host port 9090. To run several workers, publish a range so
      # each replica gets its own port: WORKER_OPS_PORTS=9090-9099 docker compose up --scale
      # worker=2, then `docker compose port --index N worker 9090` shows where each one landed.
      # (A range is not the default: Docker may pick any free port in it, even for one worker.)
      - "${WORKER_OPS_PORTS:-9090}:9090"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mockprovider:
        condition: service_started

  # --- Observability profile (bonus): docker compose --profile observability up ---------------
  # Traces: set OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 in .env, then open
  # http://localhost:16686.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: [observability]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI

  # Metrics: Prometheus scrapes every api and worker replica (Docker DNS discovery); the UI is on
  # :9190 because 9090 (or 9090-9099 when scaled) belongs to the workers.
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9190:9090"

  # Dashboards: http://localhost:3000 (anonymous viewer; admin/admin to edit). The datasource and
  # the notification-engine dashboard are provisioned from deploy/grafana.
  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/notifications.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
