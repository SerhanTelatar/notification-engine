# One-command local stack: `docker compose up --build`.
# Binaries read configuration from the environment; the defaults in .env.example match the
# service names below, so a .env file is optional.

x-app: &app
  image: notification-engine:local
  build: .
  env_file:
    - path: .env
      required: false
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify
      POSTGRES_DB: notify
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify -d notify"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672" # management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mockprovider:
    <<: *app
    command: ["/app/mockprovider"]
    ports:
      - "8090:8090" # PUT /control, GET /received (contracts/provider.md)

  migrate:
    <<: *app
    command: ["/app/api", "migrate", "up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["/app/api", "serve"]
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["/app/worker"]
    ports:
      - "9090:9090" # /healthz, /readyz, /metrics
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mockprovider:
        condition: service_started

volumes:
  pgdata:
