# sqlc configuration (pinned image sqlc/sqlc:1.31.1, see Makefile). Schema is read from the goose
# migrations (sqlc skips the "-- +goose Down" sections). Queries arrive with their user stories.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: sql/queries
    gen:
      go:
        package: sqlcgen
        out: internal/adapters/postgres/sqlcgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
