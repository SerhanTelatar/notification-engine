# Provisioned datasource; the dashboard refers to it by uid "prometheus".
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # The scrape interval (deploy/prometheus/prometheus.yml), so $__rate_interval is sized for it.
      timeInterval: "5s"
    editable: false
