# Design draft of the API contract. The first implementation task moves this file to
# api/openapi.yaml, which is then the only copy (Constitution I). Server code is generated from it.
openapi: 3.0.3
info:
  title: notification-engine API
  version: 1.0.0
  description: |
    Accepts notifications, delivers them asynchronously over SMS, Email and Push, and reports
    their status.
    Every response carries `X-Correlation-ID`, echoed from the request or generated.
servers:
  - url: http://localhost:8080
tags:
  - name: notifications
  - name: batches
  - name: templates
  - name: ops
  - name: realtime
    description: Hand-mounted (WebSocket upgrade); excluded from codegen.
  - name: ops-raw
    description: Hand-mounted (non-JSON); excluded from codegen.

paths:
  /api/v1/notifications:
    post:
      tags: [notifications]
      operationId: createNotification
      summary: Create a notification
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationRequest' }
      responses:
        '202':
          description: Accepted (new, or idempotent replay of the original)
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
            Idempotent-Replayed:
              description: Present with value `true` when the original notification is returned.
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: List notifications (newest first, cursor paginated)
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/Status' } }
        - { name: channel, in: query, schema: { $ref: '#/components/schemas/Channel' } }
        - name: from
          in: query
          description: Inclusive lower bound on created_at.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Exclusive upper bound on created_at.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          description: Page size. A value above 100 is rejected with 400.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          description: Opaque cursor from a previous page's `next_cursor`.
          schema: { type: string }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/v1/notifications/batch:
    post:
      tags: [batches]
      operationId: createBatch
      summary: Create up to 1,000 notifications; valid items are accepted even if others are invalid
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchRequest' }
      responses:
        '202':
          description: At least one item accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchCreateResult' }
        '400':
          description: >
            Malformed body, 0 or more than 1,000 items, or every item invalid. When every item is
            invalid, `details` carries per-item errors using the `items[i].field` path.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/notifications/{id}:
    get:
      tags: [notifications]
      operationId: getNotification
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Notification with attempt history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/notifications/{id}/cancel:
    post:
      tags: [notifications]
      operationId: cancelNotification
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Cancelled (or was already cancelled)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not cancellable (sending, sent or failed). `details` includes the current status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/batches/{id}:
    get:
      tags: [batches]
      operationId: getBatch
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Batch status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/batches/{id}/cancel:
    post:
      tags: [batches]
      operationId: cancelBatch
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Counts of cancelled and not-cancellable items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchCancelResult' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/templates:
    post:
      tags: [templates]
      operationId: createTemplate
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [templates]
      operationId: listTemplates
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: All templates
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Template' }

  /api/v1/templates/{id}:
    get:
      tags: [templates]
      operationId: getTemplate
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/metrics/summary:
    get:
      tags: [ops]
      operationId: getMetricsSummary
      summary: JSON operational summary computed from the DB (last 5 minutes)
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsSummary' }

  /healthz:
    get:
      tags: [ops]
      operationId: getLiveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /readyz:
    get:
      tags: [ops]
      operationId: getReadiness
      responses:
        '200':
          description: Required dependencies reachable (optional ones may be `degraded`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: A required dependency is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /ws:
    get:
      tags: [realtime]
      operationId: subscribe
      summary: WebSocket subscription to status changes (see contracts/events.md)
      description: >
        Exactly one of `notification_id` or `batch_id` is required. The id is checked before the
        upgrade. Once connected, the server sends a `snapshot` message and then a `status` message
        for each change.
      parameters:
        - { name: notification_id, in: query, schema: { type: string, format: uuid } }
        - { name: batch_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '101': { description: Switching protocols }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /metrics:
    get:
      tags: [ops-raw]
      operationId: prometheusMetrics
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain: { schema: { type: string } }

  /swagger:
    get:
      tags: [ops-raw]
      operationId: swaggerUI
      responses:
        '200':
          description: Swagger UI page
          content:
            text/html: { schema: { type: string } }

components:
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Alternative to the body field. A request that has both with different values is rejected with 400.
      schema: { type: string, minLength: 1, maxLength: 255 }
    NotificationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    BatchId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  headers:
    CorrelationId:
      schema: { type: string }

  responses:
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Unexpected error (no internals leaked)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Channel:
      type: string
      enum: [sms, email, push]
    Priority:
      type: string
      enum: [high, normal, low]
      default: normal
    Status:
      type: string
      enum: [pending, scheduled, queued, sending, sent, retrying, failed, cancelled]

    NotificationRequest:
      type: object
      required: [recipient, channel]
      description: Exactly one of `content` or `template_id` must be given.
      properties:
        recipient:
          type: string
          description: E.164 for sms, an email address for email, a device token for push.
        channel: { $ref: '#/components/schemas/Channel' }
        content:
          type: string
          description: "Limits: sms ≤ 160 chars, email ≤ 100,000 chars, push ≤ 4,000 bytes."
        priority: { $ref: '#/components/schemas/Priority' }
        scheduled_at:
          type: string
          format: date-time
          description: A time in the past means deliver now.
        idempotency_key: { type: string, minLength: 1, maxLength: 255 }
        template_id: { type: string, format: uuid }
        variables:
          type: object
          additionalProperties: { type: string }

    BatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/NotificationRequest' }

    Notification:
      type: object
      required: [id, status, channel, recipient, priority, attempts, correlation_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        batch_id: { type: string, format: uuid, nullable: true }
        status: { $ref: '#/components/schemas/Status' }
        channel: { $ref: '#/components/schemas/Channel' }
        recipient: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }
        attempts: { type: integer }
        max_attempts: { type: integer }
        provider_message_id: { type: string, nullable: true }
        last_error: { type: string, nullable: true }
        template_id: { type: string, format: uuid, nullable: true }
        idempotency_key: { type: string, nullable: true }
        correlation_id: { type: string }
        scheduled_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        sent_at: { type: string, format: date-time, nullable: true }

    Attempt:
      type: object
      required: [attempt_no, started_at, outcome]
      properties:
        attempt_no: { type: integer }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        latency_ms: { type: integer }
        http_status: { type: integer, nullable: true }
        outcome: { type: string, enum: [success, transient, permanent, abandoned] }
        error: { type: string, nullable: true }

    NotificationDetail:
      allOf:
        - $ref: '#/components/schemas/Notification'
        - type: object
          required: [content, attempt_history]
          properties:
            content: { type: string }
            attempt_history:
              type: array
              items: { $ref: '#/components/schemas/Attempt' }

    NotificationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        next_cursor:
          type: string
          nullable: true
          description: Absent or null on the last page.

    BatchItemResult:
      type: object
      required: [index, accepted]
      properties:
        index: { type: integer }
        accepted: { type: boolean }
        notification_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/Status' }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }

    BatchCreateResult:
      type: object
      required: [batch_id, accepted, rejected, items]
      properties:
        batch_id: { type: string, format: uuid }
        accepted: { type: integer }
        rejected: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/BatchItemResult' }

    BatchDetail:
      type: object
      required: [batch_id, total, counts, items, created_at]
      properties:
        batch_id: { type: string, format: uuid }
        total: { type: integer }
        counts:
          type: object
          description: Count per status; missing statuses mean zero.
          additionalProperties: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        created_at: { type: string, format: date-time }

    BatchCancelResult:
      type: object
      required: [batch_id, cancelled, already_cancelled, not_cancellable]
      properties:
        batch_id: { type: string, format: uuid }
        cancelled: { type: integer }
        already_cancelled: { type: integer }
        not_cancellable: { type: integer }

    TemplateRequest:
      type: object
      required: [name, body]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        body:
          type: string
          minLength: 1
          maxLength: 100000
          description: 'Only plain field actions are allowed, e.g. "Hi {{.Name}}, your code is {{.Code}}".'

    Template:
      type: object
      required: [id, name, body, variables, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        body: { type: string }
        variables:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }

    MetricsSummary:
      type: object
      required: [window_seconds, backlog, channels]
      properties:
        window_seconds: { type: integer, example: 300 }
        backlog:
          type: array
          items:
            type: object
            properties:
              channel: { $ref: '#/components/schemas/Channel' }
              priority: { $ref: '#/components/schemas/Priority' }
              status: { $ref: '#/components/schemas/Status' }
              count: { type: integer }
        channels:
          type: array
          items:
            type: object
            properties:
              channel: { $ref: '#/components/schemas/Channel' }
              sent: { type: integer }
              failed: { type: integer }
              retried: { type: integer }
              success_rate: { type: number, format: double }
              e2e_latency_ms: { $ref: '#/components/schemas/Percentiles' }
              provider_latency_ms: { $ref: '#/components/schemas/Percentiles' }

    Percentiles:
      type: object
      properties:
        p50: { type: number }
        p95: { type: number }
        p99: { type: number }

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, unavailable] }
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, degraded, unavailable]

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: recipient
          description: JSON path of the field; batch errors use `items[3].content`.
        message: { type: string }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - validation_failed
                - not_found
                - idempotency_conflict
                - not_cancellable
                - template_name_taken
                - internal
            message: { type: string }
            details:
              type: array
              items: { $ref: '#/components/schemas/FieldError' }
            current_status: { $ref: '#/components/schemas/Status' }
